  <title>VentureSwarm — Multi-Agent Autonomous Launch Platform</title>

  <!-- React 18 & ReactDOM -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', '"Noto Sans"', 'Helvetica', 'Arial', 'sans-serif'],
            mono: ['"Fira Code"', 'ui-monospace', 'SFMono-Regular', '"SF Mono"', 'Menlo', 'Consolas', '"Liberation Mono"', 'monospace'],
          },
          colors: {
            // Official GitHub Dark Palette (Primer Dark Default)
            gh: {
              canvas: '#0d1117',        // Default background
              subtle: '#161b22',        // Surface / secondary header
              inset: '#010409',         // Inset dark / inputs / code blocks
              overlay: '#1f242c',       // Elevated menus / dropdowns
              border: '#30363d',        // Default border
              borderMuted: '#21262d',   // Muted separator border
              fg: '#f0f6fc',            // Primary text (high contrast)
              fgMuted: '#8b949e',       // Secondary muted text
              fgSubtle: '#6e7681',      // Tertiary subtle text
              // Brand accents
              green: '#238636',         // Primary commit / merge button
              greenHover: '#2ea043',    // Button hover
              greenText: '#3fb950',     // Success text & badges
              blue: '#1f6feb',          // Issue / action blue
              blueHover: '#388bfd',     // Blue hover
              blueText: '#58a6ff',      // Link & badge blue
              purple: '#8957e5',        // PR merged purple
              purpleText: '#bc8cff',    // Purple text
              red: '#da3633',           // Flaw / closed red
              redText: '#f85149',       // Red text
              orange: '#d29922',        // Warning / debate orange
              orangeText: '#f0883e',    // Orange text
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* GitHub-style Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0d1117;
    }
    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8b949e;
    }

    /* GitHub Button Transitions */
    .gh-btn-primary {
      background-color: #238636;
      border: 1px solid rgba(240, 246, 252, 0.1);
      box-shadow: 0 1px 0 rgba(27, 31, 36, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition: 0.15s cubic-bezier(0.3, 0, 0.5, 1);
    }
    .gh-btn-primary:hover:not(:disabled) {
      background-color: #2ea043;
      border-color: rgba(240, 246, 252, 0.15);
    }
    .gh-btn-primary:active:not(:disabled) {
      background-color: #238636;
      box-shadow: inset 0 1px 0 rgba(0, 45, 17, 0.2);
    }

    .gh-btn-secondary {
      background-color: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      box-shadow: 0 1px 0 rgba(27, 31, 36, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.02);
      transition: 0.15s cubic-bezier(0.3, 0, 0.5, 1);
    }
    .gh-btn-secondary:hover:not(:disabled) {
      background-color: #30363d;
      border-color: #8b949e;
      color: #f0f6fc;
    }

    /* GitHub Active Node Pulse */
    @keyframes ghPulse {
      0%, 100% { border-color: #58a6ff; box-shadow: 0 0 0 1px #58a6ff; }
      50% { border-color: #1f6feb; box-shadow: 0 0 8px rgba(88, 166, 255, 0.35); }
    }
    .gh-active-pulse {
      animation: ghPulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gh-canvas text-gh-fg antialiased selection:bg-[#1f6feb]/30 selection:text-gh-fg">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Pure React Native SVG Icons (100% Virtual-DOM Safe)
    function Icon({ name, className = "w-4 h-4" }) {
      const icons = {

            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>

        ),

        ),
        shieldAlert: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">

            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>

        ),
        checkCircle: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        ),
        terminal: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
        ),
        gitPullRequest: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/>
          </svg>
        ),
        layout: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
        ),
        mail: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        ),
        shield: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        ),
        database: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
          </svg>
        ),
        userCheck: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/>
          </svg>
        ),
        layers: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
          </svg>
        ),
        network: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <rect x="9" y="2" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/>
            <path d="M12 8v4m-7 4v-2a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2"/>
          </svg>
        ),
        loader2: (
          <svg className={`${className} animate-spin`} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        ),
        download: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        ),
        xCircle: (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        )
      };
      return icons[name] || null;
    }

    // GitHub Dark styled Agent Node Metadata
    const AGENT_NODES = [
      { id: "Scout", label: "Scout", role: "Market Discovery", icon: "search", color: "text-gh-blueText" },
      { id: "Harvester", label: "Harvester", role: "Live Scraper", icon: "globe", color: "text-cyan-400" },
      { id: "Demographer", label: "Demographer", role: "ICP Architect", icon: "users", color: "text-gh-greenText" },
      { id: "Wordsmith", label: "Wordsmith", role: "Asset Copywriter", icon: "penTool", color: "text-gh-orangeText" },
      { id: "Overwatch", label: "Overwatch", role: "Strategist Critic", icon: "shieldAlert", color: "text-gh-redText" },
      { id: "Foundry", label: "Foundry", role: "Deploy Engine", icon: "box", color: "text-gh-purpleText" }
    ];

    const TABS = [
      { id: "landing", label: "Landing Page", icon: "layout" },
      { id: "emails", label: "Outbound Cadence", icon: "mail" },
      { id: "battlecard", label: "Competitor Matrix", icon: "shield" },
      { id: "leads", label: "Leads Database", icon: "database" },
      { id: "icp", label: "ICP Dossier", icon: "userCheck" }
    ];

    const SAMPLE_IDEAS = [
      "B2B Agentic SDR that scrapes LinkedIn jobs and auto-pitches custom Loom videos to VP Sales",
      "Autonomous SEO Auditor that crawls competitor blogs, finds keyword gaps, and writes ready-to-rank articles",
      "Vertical ERP and dispatch copilot for residential HVAC and roofing contractors",
      "Micro-SaaS that monitors Stripe churn and deploys personalized win-back discount sequences automatically"
    ];

    function App() {
      const [idea, setIdea] = useState("");
      const [apiKey, setApiKey] = useState("");
      const [provider, setProvider] = useState("auto");
      const [maxDebateRounds, setMaxDebateRounds] = useState(2);
      const [showSettings, setShowSettings] = useState(false);
      
      const [isRunning, setIsRunning] = useState(false);
      const [activeAgent, setActiveAgent] = useState(null);
      const [thoughts, setThoughts] = useState([]);
      const [debateEntries, setDebateEntries] = useState([]);
      const [finalAssets, setFinalAssets] = useState(null);
      const [activeTab, setActiveTab] = useState("landing");
      const [landingPreviewMode, setLandingPreviewMode] = useState("preview"); // preview or code
      const [copiedText, setCopiedText] = useState("");

      const thoughtsEndRef = useRef(null);

      useEffect(() => {
        thoughtsEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [thoughts]);

      const handleStreamEvent = (event) => {
        if (event.type === "init") {
          setThoughts(prev => [...prev, {
            agent: "system",
            message: `${event.message} [Engine: ${event.provider_status?.model || 'Active'}]`,
            status: "system",
            timestamp: "0.00"
          }]);
        } else if (event.type === "thought") {
          setActiveAgent(event.agent);
          setThoughts(prev => [...prev, event]);

          // Capture debate entries
          if (event.payload?.debate_entry) {
            setDebateEntries(prev => [...prev, event.payload.debate_entry]);
          }
        } else if (event.type === "done") {
          if (event.final_assets) {
            setFinalAssets(event.final_assets);
          }
        } else if (event.type === "error") {
          setThoughts(prev => [...prev, {
            agent: "system",
            message: `Execution error: ${event.error}`,
            status: "error",
            timestamp: "ERR"
          }]);
        }
      };

      const handleLaunch = async () => {
        if (!idea.trim() || isRunning) return;

        setIsRunning(true);
        setActiveAgent("Scout");
        setThoughts([]);
        setDebateEntries([]);
        setFinalAssets(null);
        setActiveTab("landing");

        try {
          const response = await fetch("/api/swarm/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              idea: idea.trim(),
              api_key: apiKey.trim() || null,
              provider: provider,
              max_debate_rounds: Number(maxDebateRounds)
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${await response.text()}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n\n");
            buffer = lines.pop() || "";

            for (const line of lines) {
              if (line.startsWith("data: ")) {
                const jsonStr = line.slice(6);
                try {
                  const event = JSON.parse(jsonStr);
                  handleStreamEvent(event);
                } catch (e) {
                  console.error("Error processing stream event:", e, jsonStr);
                }
              }
            }
          }
        } catch (err) {
          console.error("Swarm stream failed:", err);
          setThoughts(prev => [...prev, {
            agent: "system",
            message: `Stream connection error: ${err.message}`,
            status: "error",
            timestamp: "0.00"
          }]);
        } finally {
          setIsRunning(false);
          setActiveAgent(null);
        }
      };

      const copyToClipboard = (text, label) => {
        navigator.clipboard.writeText(text);
        setCopiedText(label);
        setTimeout(() => setCopiedText(""), 2000);
      };

      const downloadFile = (content, filename, type) => {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      return (
        <div className="flex flex-col min-h-screen bg-gh-canvas text-gh-fg">
          
          {/* GitHub Header Navigation Bar */}
          <header className="border-b border-gh-border bg-gh-subtle sticky top-0 z-40">
            <div className="max-w-[1720px] w-full mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 h-16 flex items-center justify-between">
              
              <div className="flex items-center space-x-3.5">
                {/* GitHub-style octicon mark */}
                <div className="w-8 h-8 rounded-full bg-gh-inset border border-gh-border flex items-center justify-center text-gh-fg">
                  <Icon name="gitBranch" className="w-4 h-4 text-gh-fg" />
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-semibold text-sm tracking-tight text-gh-fg">
                      ventureswarm <span className="text-gh-fgMuted">/</span> <strong className="text-gh-fg font-bold">engine</strong>
                    </span>
                    <span className="px-2 py-0.5 rounded-full text-[11px] font-mono font-medium bg-[#1f6feb]/15 text-gh-blueText border border-[#1f6feb]/30">
                      Public
                    </span>
                  </div>
                  <div className="text-[11px] text-gh-fgMuted font-mono flex items-center gap-1.5 mt-0.5">
                    <span className="w-2 h-2 rounded-full bg-gh-greenText inline-block"></span>
                    <span>Multi-Agent GTM Swarm</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <button 
                  onClick={() => setShowSettings(!showSettings)}
                  className={`gh-btn-secondary flex items-center space-x-2 px-3.5 py-1.5 text-xs font-medium rounded-md ${showSettings ? 'border-gh-fgMuted bg-gh-overlay text-gh-fg' : ''}`}
                >
                  <Icon name="sliders" className="w-3.5 h-3.5" />
                  <span>Settings</span>
                </button>

                <div className="hidden sm:flex items-center space-x-2 px-3.5 py-1.5 bg-gh-subtle border border-gh-border rounded-md text-xs font-mono text-gh-fgMuted">
                  <Icon name="activity" className="w-3.5 h-3.5 text-gh-greenText" />
                  <span>Debate: <span className="text-gh-fg font-semibold">{maxDebateRounds} cycles</span></span>
                </div>
              </div>
            </div>

            {/* Config Drawer */}
            {showSettings && (
              <div className="border-t border-gh-border bg-gh-inset px-4 sm:px-6 lg:px-8 xl:px-10 py-5">
                <div className="max-w-[1720px] w-full mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
                  <div>
                    <label className="block text-gh-fg font-medium mb-1.5 font-mono">API KEY (GEMINI OR OPENAI - OPTIONAL)</label>
                    <input 
                      type="password"
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      placeholder="Leave blank to use built-in Swarm engine"
                      className="w-full px-3.5 py-2.5 bg-gh-subtle border border-gh-border rounded-md text-gh-fg font-mono placeholder-gh-fgSubtle focus:outline-none focus:border-gh-blueText focus:ring-1 focus:ring-gh-blueText"
                    />
                    <p className="text-[11px] text-gh-fgMuted mt-1.5">Runs deterministic swarm intelligence with live DuckDuckGo web search if blank.</p>
                  </div>

                  <div>
                    <label className="block text-gh-fg font-medium mb-1.5 font-mono">PROVIDER ENGINE</label>
                    <select 
                      value={provider}
                      onChange={(e) => setProvider(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-gh-subtle border border-gh-border rounded-md text-gh-fg font-mono focus:outline-none focus:border-gh-blueText"
                    >
                      <option value="auto">Auto-Detect (Gemini 3.8 Flash / OpenAI / Local)</option>
                      <option value="gemini">Google Gemini (gemini-3.8-flash)</option>
                      <option value="openai">OpenAI (gpt-4o)</option>
                      <option value="simulation">Offline Heuristic Swarm</option>
                    </select>
                  </div>

                  <div>

                            </span>
                          </div>

                          <div className="overflow-x-auto border border-gh-border rounded-xl bg-gh-subtle text-xs sm:text-sm shadow-sm">
                            <table className="w-full text-left border-collapse">
                              <thead>
                                <tr className="border-b border-gh-border bg-gh-inset font-mono text-gh-fgMuted uppercase tracking-wider">
                                  <th className="px-5 py-3.5">Lead Name</th>
                                  <th className="px-5 py-3.5">Job Title</th>
                                  <th className="px-5 py-3.5">Company</th>
                                  <th className="px-5 py-3.5">Budget</th>
                                  <th className="px-5 py-3.5">Personalized Hook Angle</th>
                                </tr>
                              </thead>
                              <tbody>
                                {finalAssets.leads_csv.split('\n').slice(1, 9).map((row, rIdx) => {
                                  const cols = row.split(',');
                                  if (cols.length < 5) return null;
                                  return (
                                    <tr key={rIdx} className="border-b border-gh-border hover:bg-gh-overlay transition-colors">
                                      <td className="px-5 py-4 font-semibold text-gh-fg">
                                        <div className="text-sm">{cols[0]} {cols[1]}</div>
                                        <div className="text-[11px] text-gh-fgSubtle font-mono mt-0.5">{cols[8]}</div>
                                      </td>
                                      <td className="px-5 py-4 text-gh-fg">{cols[2]}</td>
                                      <td className="px-5 py-4 text-gh-fg">
                                        <div className="font-medium">{cols[3]}</div>
                                        <div className="text-[11px] text-gh-fgSubtle font-mono mt-0.5">{cols[4]} ({cols[5]} emp)</div>
                                      </td>
                                      <td className="px-5 py-4 font-mono text-gh-orangeText font-medium">{cols[6]}</td>
                                      <td className="px-5 py-4 text-gh-fgMuted text-xs leading-relaxed max-w-sm">{cols[7]}</td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}

                      {/* TAB 5: ICP DOSSIER */}
                      {activeTab === "icp" && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5 text-xs sm:text-sm">
                          <div className="bg-gh-subtle border border-gh-border p-6 rounded-xl shadow-sm">
                            <span className="text-[11px] font-mono uppercase font-semibold text-gh-blueText tracking-wider">Target Decision Maker</span>
                            <h3 className="text-lg font-semibold text-gh-fg mt-1.5 mb-3">{finalAssets.persona_data?.icp_title}</h3>
                            <div className="space-y-2 font-mono text-gh-fgMuted text-xs sm:text-sm">
                              <div>Industry: <span className="text-gh-fg">{finalAssets.persona_data?.company_profile?.industry}</span></div>
                              <div>Company Size: <span className="text-gh-fg">{finalAssets.persona_data?.company_profile?.size}</span></div>
                              <div>Target Budget: <span className="text-gh-orangeText font-medium">{finalAssets.persona_data?.willingness_to_pay}</span></div>
                            </div>
                          </div>

                          <div className="bg-gh-subtle border border-gh-border p-6 rounded-xl shadow-sm">
                            <span className="text-[11px] font-mono uppercase font-semibold text-gh-redText tracking-wider">Acute Bleeding Pain Points</span>
                            <ul className="mt-3 space-y-2.5 text-gh-fg">
                              {finalAssets.persona_data?.acute_pain_points?.map((pain, i) => (
                                <li key={i} className="flex items-start gap-2.5 bg-gh-inset p-3 rounded-lg border border-gh-border leading-relaxed text-xs sm:text-sm">
                                  <span className="text-gh-redText mt-0.5">•</span>
                                  <span>{pain}</span>
                                </li>
                              ))}
                            </ul>
                          </div>

                          <div className="md:col-span-2 bg-gh-subtle border border-gh-border p-6 rounded-xl shadow-sm">
                            <span className="text-[11px] font-mono uppercase font-semibold text-gh-greenText tracking-wider">Objection Pre-emption Matrix</span>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                              {finalAssets.persona_data?.key_objections?.map((obj, i) => (
                                <div key={i} className="p-4 bg-gh-inset rounded-lg border border-gh-border space-y-1.5">
                                  <div className="font-semibold text-gh-fg">"{obj.objection}"</div>
                                  <div className="text-gh-greenText text-xs sm:text-sm leading-relaxed">→ {obj.counter_proof}</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}

                    </div>
                  )}
                </div>

              </div>

            </div>

          </main>
        </div>
      );
    }

    // Modern React 18 createRoot
    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
